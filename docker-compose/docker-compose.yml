services:
  database:
    image: "postgres:bookworm"
    ports:
      - 5455:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:6.0
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: always

  mock-identity-system:
    image: "mosipid/mock-identity-system:0.13.0"
    user: root
    ports:
      - 8082:8082
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MOSIP_MOCK_IDA_KYC_TRANSACTION_TIMEOUT_SECS=900
      - MOSIP_ESIGNET_HOST=localhost:8088
    depends_on:
      - database

  esignet:
    image: "mosipid/esignet-with-plugins:1.8.0"
    user: root
    ports:
      - 8088:8088
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - plugin_name_env=esignet-mock-plugin.jar
      - MOSIP_ESIGNET_DATABASE_URL=jdbc:postgresql://database:5432/mosip_esignet?currentSchema=esignet
      - MOSIP_ESIGNET_DATABASE_USERNAME=postgres
      - MOSIP_ESIGNET_DATABASE_PASSWORD=postgres
      - MOSIP_ESIGNET_MOCK_DOMAIN_URL=http://mock-identity-system:8082
      - MOSIP_ESIGNET_INTEGRATION_KEY_BINDER=MockKeyBindingWrapperService
      # Public base URL (ALB hostname). Used as issuer and in OIDC discovery metadata.
      - MOSIP_ESIGNET_DOMAIN_URL=https://esignet.inji-jm.iugolabs.com
      - MOSIP_ESIGNET_TOKEN_ENDPOINT=https://esignet.inji-jm.iugolabs.com/v1/esignet/oauth/v2/token
      - MOSIP_ESIGNET_SUPPORTED_CREDENTIAL_SCOPES={'mock_identity_vc_ldp'}
      - "MOSIP_ESIGNET_CREDENTIAL_SCOPERESOURCEMAPPING={'mock_identity_vc_ldp': 'https://certify.inji-jm.iugolabs.com/v1/certify/issuance/credential'}"
      - "MOSIP_ESIGNET_UI_SIGNUP_CONFIG={'signup.banner': false, 'signup.url': 'http://localhost:8089/signup'}"
      # Workaround for oidc-ui 1.8.0: axios sends cookie UUID as X-XSRF-TOKEN instead of JSON token.
      - MOSIP_ESIGNET_SECURITY_IGNORE_CSRF_URLS=/oidc/**,/oauth/**,/actuator/**,/favicon.ico,/error,/swagger-ui/**,/v3/api-docs/**,/linked-authorization/link-transaction,/linked-authorization/authenticate,/linked-authorization/consent,/binding/**,/client-mgmt/**,/system-info/**,/linked-authorization/v2/link-transaction,/linked-authorization/v2/authenticate,/linked-authorization/v2/consent,/authorization/**
      - SPRING_CACHE_TYPE=redis
      - SPRING_DATA_REDIS_HOST=redis-server
      - SPRING_REDIS_PASSWORD=
      - KAFKA_ENABLED=false
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    depends_on:
      - database
      - mock-identity-system
      - redis

  esignet-ui:
    image: "mosipid/oidc-ui:1.8.0"
    user: root
    ports:
      - 3000:3000
    environment:
      - container_user=mosip
      - DEFAULT_THEME=#0e4f5c
      - DEFAULT_TITLE=JAMCTA Digital ID
      - DEFAULT_ID_PROVIDER_NAME=JAMCTA Digital ID
      - DEFAULT_WELLKNOWN=%5B%7B%22name%22%3A%22OpenID%20Configuration%22%2C%22value%22%3A%22%2F.well-known%2Fopenid-configuration%22%7D%2C%7B%22name%22%3A%22Jwks%20Json%22%2C%22value%22%3A%22%2F.well-known%2Fjwks.json%22%7D%2C%7B%22name%22%3A%22Authorization%20Server%22%2C%22value%22%3A%22%2F.well-known%2Foauth-authorization-server%22%7D%5D
      - SIGN_IN_WITH_ESIGNET_PLUGIN_URL=https://raw.githubusercontent.com/mosip/artifactory-ref-impl/master/artifacts/src/mosip-plugins/sign-in-with-esignet/sign-in-with-esignet.zip
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./jamaica-theme/theme/variables.css:/usr/share/nginx/html/theme/variables.css
      - ./jamaica-theme/theme/config.json:/usr/share/nginx/html/theme/config.json
      - ./jamaica-theme/locales/en.json:/usr/share/nginx/html/locales/en.json
      - ./jamaica-theme/images/brand_logo.png:/usr/share/nginx/html/images/brand_logo.png
      - ./jamaica-theme/images/logo.png:/usr/share/nginx/html/logo.png
      - ./jamaica-theme/images/footer_logo.png:/usr/share/nginx/html/images/footer_logo.png
      - ./jamaica-theme/images/top_left_bg_logo.svg:/usr/share/nginx/html/images/top_left_bg_logo.svg
      - ./jamaica-theme/images/bottom_right_bg_logo.svg:/usr/share/nginx/html/images/bottom_right_bg_logo.svg
    depends_on:
      - esignet
